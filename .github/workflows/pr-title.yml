name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            perf
            docs
            style
            build
            ci
            chore
            revert
          scopes: |
            lanrpc
            devices
            discovery
            setup
            rooms
            automations
            core
            app
            ui
            l10n
            fake-shelly
            deps
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" in the title "{title}" must start with a
            lowercase letter and must not end with a period.
            Example: feat(devices): add cover position slider
