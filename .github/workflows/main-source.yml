name: Release branch rules

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check-source:
    name: Check source branch
    runs-on: ubuntu-latest
    steps:
      - name: Only develop or hotfix/* may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests to main must come from this repository, not from a fork."
            exit 1
          fi
          case "$HEAD_REF" in
            develop|hotfix/*)
              echo "Source branch '$HEAD_REF' is allowed."
              ;;
            *)
              echo "::error::Pull requests to main must come from 'develop' or 'hotfix/*', not '$HEAD_REF'. Target 'develop' instead."
              exit 1
              ;;
          esac
